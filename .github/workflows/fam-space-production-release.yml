name: Fam Space production release

on:
  workflow_run:
    workflows:
      - Fam Space bridge
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fam-space-production-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer Fam Space
        uses: actions/checkout@v4
        with:
          repository: DevWeb13/fam-space-qwik
          ref: master
          token: ${{ secrets.FAM_SPACE_TOKEN }}
          fetch-depth: 0

      - name: Avancer production vers master au maximum toutes les 6 heures
        shell: bash
        run: |
          set -euo pipefail

          marker="automation-control/production-release"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master production --tags --prune

          master_sha="$(git rev-parse origin/master)"
          production_sha="$(git rev-parse origin/production)"

          echo "master:     $master_sha"
          echo "production: $production_sha"

          if [ "$master_sha" = "$production_sha" ]; then
            echo "Aucun changement à publier."
            if ! git show-ref --verify --quiet "refs/tags/$marker"; then
              git tag -a "$marker" "$production_sha" -m "Production release marker"
              git push origin "refs/tags/$marker"
              echo "Marqueur de dernière release initialisé."
            fi
            exit 0
          fi

          if ! git merge-base --is-ancestor origin/production origin/master; then
            echo "::error::La branche production a divergé de master. Aucun push forcé."
            exit 1
          fi

          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && git show-ref --verify --quiet "refs/tags/$marker"; then
            last_release="$(git for-each-ref --format='%(taggerdate:unix)' "refs/tags/$marker")"
            now="$(date +%s)"
            age_seconds=$((now - last_release))
            if [ "$age_seconds" -lt $((6 * 60 * 60)) ]; then
              echo "Dernière release trop récente: production reste inchangée."
              exit 0
            fi
          fi

          git push origin "$master_sha:refs/heads/production"
          git fetch origin production

          deployed_sha="$(git rev-parse origin/production)"
          if [ "$deployed_sha" != "$master_sha" ]; then
            echo "::error::production ne pointe pas sur le master attendu après le push."
            exit 1
          fi

          git tag -fa "$marker" "$master_sha" -m "Production release marker"
          git push --force origin "refs/tags/$marker"

          {
            echo "## Release Fam Space"
            echo
            echo "- Résultat: succès"
            echo "- production avancée vers: \`$master_sha\`"
            echo "- Déclenchement Vercel limité à une release toutes les 6 heures réelles."
          } >> "$GITHUB_STEP_SUMMARY"
