name: Fam Space production release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fam-space-production-release.yml
      - scripts/export-radar-catalog.mjs
  schedule:
    - cron: "18 5,11,17,23 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fam-space-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      advanced: ${{ steps.release.outputs.advanced }}

    steps:
      - name: Récupérer Fam Space
        uses: actions/checkout@v4
        with:
          repository: DevWeb13/fam-space-qwik
          ref: master
          token: ${{ secrets.FAM_SPACE_TOKEN }}
          fetch-depth: 0

      - name: Avancer production vers master
        id: release
        shell: bash
        run: |
          set -euo pipefail

          echo "advanced=false" >> "$GITHUB_OUTPUT"

          git fetch origin master production --prune
          master_sha="$(git rev-parse origin/master)"
          production_sha="$(git rev-parse origin/production)"

          echo "master:     $master_sha"
          echo "production: $production_sha"

          if [ "$master_sha" = "$production_sha" ]; then
            echo "Aucun changement à publier."
            exit 0
          fi

          if ! git merge-base --is-ancestor origin/production origin/master; then
            echo "::error::La branche production a divergé de master. Aucun push forcé."
            exit 1
          fi

          internal_only=true
          while IFS= read -r path; do
            case "$path" in
              content-data/publication-workflow.md|content-data/publication-phase.json|content-data/publication-rotation.json|content-data/publication-category-rotation.json|content-data/radar-workflow.md|content-data/radar-phases/01-detect.md|.github/scripts/process-publication-request.sh|.github/scripts/render-radar-runtime.sh|scripts/process-publication-request.mjs|scripts/render-publication-runtime.mjs|scripts/render-radar-runtime.mjs)
                ;;
              *)
                internal_only=false
                break
                ;;
            esac
          done < <(git diff --name-only origin/production..origin/master)

          if [ "$internal_only" = true ]; then
            echo "Uniquement une transition interne du pipeline publication: aucune release production."
            exit 0
          fi

          git push origin "$master_sha:refs/heads/production"
          git fetch origin production

          deployed_sha="$(git rev-parse origin/production)"
          if [ "$deployed_sha" != "$master_sha" ]; then
            echo "::error::production ne pointe pas sur le master attendu après le push."
            exit 1
          fi

          echo "advanced=true" >> "$GITHUB_OUTPUT"

          {
            echo "## Release Fam Space"
            echo
            echo "- Résultat: succès"
            echo "- production avancée vers: `$master_sha`"
            echo "- Prochain passage automatique: dans environ 6 heures."
          } >> "$GITHUB_STEP_SUMMARY"

  radar_catalog:
    name: Actualiser le catalogue Radar depuis master
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer Fam Space master
        uses: actions/checkout@v4
        with:
          repository: DevWeb13/fam-space-qwik
          ref: master
          token: ${{ secrets.FAM_SPACE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: fam-space

      - name: Récupérer le bridge
        uses: actions/checkout@v4
        with:
          ref: main
          path: bridge

      - name: Préparer Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fam-space/package-lock.json

      - name: Réutiliser le catalogue et l'index éditorial du site
        working-directory: fam-space
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run content:compile --silent
          node ../bridge/scripts/export-radar-catalog.mjs . "$RUNNER_TEMP/radar-catalog.json"

      - name: Synchroniser uniquement si le contenu a changé
        working-directory: bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B radar-catalog-sync origin/main
            cp "$RUNNER_TEMP/radar-catalog.json" radar-catalog.json
            git add -- radar-catalog.json
            if git diff --cached --quiet; then
              echo "Catalogue Radar inchangé: aucune écriture GitHub."
              exit 0
            fi
            git commit -m "data: sync Radar editorial catalog"
            if git push origin HEAD:main; then
              echo "Catalogue Radar actualisé sans déploiement Vercel."
              exit 0
            fi
          done

          echo "Échec de synchronisation du catalogue Radar après 3 tentatives." >&2
          exit 1

      - name: Préparer le runtime Radar depuis le catalogue courant
        working-directory: fam-space
        shell: bash
        run: |
          bash .github/scripts/render-radar-runtime.sh \
            ../bridge/radar-gsc-snapshot.json \
            ../bridge/radar-catalog.json \
            "$RUNNER_TEMP/radar-runtime.md"

      - name: Synchroniser le runtime Radar
        working-directory: bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B radar-runtime-after-catalog origin/main
            cp "$RUNNER_TEMP/radar-runtime.md" radar-runtime.md
            git add radar-runtime.md
            if git diff --cached --quiet; then
              echo "Runtime Radar inchangé."
              exit 0
            fi
            git commit -m "state: refresh Radar runtime from catalog"
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "Impossible de synchroniser le runtime Radar après 3 tentatives." >&2
          exit 1

  facebook:
    needs: release
    if: ${{ needs.release.outputs.advanced == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/fam-space-social.yml
    secrets: inherit
