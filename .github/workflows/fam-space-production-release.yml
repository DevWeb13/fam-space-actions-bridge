name: Fam Space production release

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fam-space-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      advanced: ${{ steps.release.outputs.advanced }}

    steps:
      - name: Récupérer Fam Space
        uses: actions/checkout@v4
        with:
          repository: DevWeb13/fam-space-qwik
          ref: master
          token: ${{ secrets.FAM_SPACE_TOKEN }}
          fetch-depth: 0

      - name: Avancer production vers master
        id: release
        shell: bash
        run: |
          set -euo pipefail

          echo "advanced=false" >> "$GITHUB_OUTPUT"

          git fetch origin master production --prune
          master_sha="$(git rev-parse origin/master)"
          production_sha="$(git rev-parse origin/production)"

          echo "master:     $master_sha"
          echo "production: $production_sha"

          if [ "$master_sha" = "$production_sha" ]; then
            echo "Aucun changement à publier."
            exit 0
          fi

          if ! git merge-base --is-ancestor origin/production origin/master; then
            echo "::error::La branche production a divergé de master. Aucun push forcé."
            exit 1
          fi

          internal_only=true
          while IFS= read -r path; do
            case "$path" in
              content-data/publication-workflow.md|content-data/publication-phase.json|content-data/publication-rotation.json|content-data/publication-category-rotation.json)
                ;;
              *)
                internal_only=false
                break
                ;;
            esac
          done < <(git diff --name-only origin/production..origin/master)

          if [ "$internal_only" = true ]; then
            echo "Uniquement une transition interne du pipeline publication: aucune release production."
            exit 0
          fi

          git push origin "$master_sha:refs/heads/production"
          git fetch origin production

          deployed_sha="$(git rev-parse origin/production)"
          if [ "$deployed_sha" != "$master_sha" ]; then
            echo "::error::production ne pointe pas sur le master attendu après le push."
            exit 1
          fi

          echo "advanced=true" >> "$GITHUB_OUTPUT"

          {
            echo "## Release Fam Space"
            echo
            echo "- Résultat: succès"
            echo "- production avancée vers: `$master_sha`"
            echo "- Prochain passage automatique: dans environ 6 heures."
          } >> "$GITHUB_STEP_SUMMARY"

  facebook:
    needs: release
    if: ${{ needs.release.outputs.advanced == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/fam-space-social.yml
    secrets: inherit
