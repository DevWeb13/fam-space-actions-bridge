name: Fam Space Instagram

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - live-one
      target_slug:
        description: "Slug obligatoire en mode live-one"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fam-space-instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Recuperer le bridge
        uses: actions/checkout@v4
        with:
          ref: main
          path: bridge
          fetch-depth: 0

      - name: Recuperer Fam Space production
        uses: actions/checkout@v4
        with:
          repository: DevWeb13/fam-space-qwik
          ref: production
          token: ${{ secrets.FAM_SPACE_TOKEN }}
          path: fam-space
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verifier le publisher Instagram
        shell: bash
        run: node --check bridge/scripts/publish-instagram.mjs

      - name: Executer le publisher Instagram
        shell: bash
        env:
          FAM_SPACE_DIR: ${{ github.workspace }}/fam-space
          PINTEREST_FEED_URL: https://www.fam-space.fr/pinterest-v2.xml
          SOCIAL_DRY_RUN: ${{ inputs.mode == 'dry-run' && 'true' || 'false' }}
          INSTAGRAM_TARGET_SLUG: ${{ inputs.target_slug }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: node bridge/scripts/publish-instagram.mjs bridge/instagram-state.json

      - name: Enregistrer l'etat Instagram apres publication
        if: ${{ inputs.mode == 'live-one' }}
        shell: bash
        run: |
          set -euo pipefail
          cd bridge
          if git diff --quiet -- instagram-state.json; then
            echo "Aucun changement d'état Instagram à enregistrer."
            exit 0
          fi
          git config user.name "fam-space-actions"
          git config user.email "actions@users.noreply.github.com"
          git add instagram-state.json
          git commit -m "state: record Instagram publication"
          git push origin HEAD:main
