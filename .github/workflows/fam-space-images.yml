name: Fam Space images

on:
  push:
    branches:
      - main
    paths:
      - image-request.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fam-space-master-write
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le signal
        uses: actions/checkout@v4
        with:
          path: bridge

      - name: Récupérer Fam Space
        uses: actions/checkout@v4
        with:
          repository: DevWeb13/fam-space-qwik
          ref: master
          token: ${{ secrets.FAM_SPACE_TOKEN }}
          fetch-depth: 0
          path: fam-space

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fam-space/package-lock.json

      - name: Installer les dépendances
        working-directory: fam-space
        run: npm ci

      - name: Traiter la demande image
        working-directory: fam-space
        shell: bash
        run: |
          set -euo pipefail

          signal="$(grep -v '^[[:space:]]*$' ../bridge/image-request.txt | tail -n 1 | tr -d '\r\n')"

          if [ -z "$signal" ] || [ "$signal" = "idle" ]; then
            echo "Aucune demande image à traiter."
            exit 0
          fi

          branch="${signal%%|*}"
          requested_commit="${signal##*|}"

          if [ "$branch" = "$signal" ] || [[ ! "$branch" =~ ^automation/image-[A-Za-z0-9._-]+$ ]] || [[ ! "$requested_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Signal image invalide: $signal" >&2
            exit 1
          fi

          git fetch origin master --prune
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" --prune || true

          if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            echo "Branche candidate image introuvable: $branch" >&2
            exit 1
          fi

          remote_commit="$(git rev-parse "origin/$branch")"
          if [ "$remote_commit" != "$requested_commit" ]; then
            echo "Signal image obsolète: demandé=$requested_commit, branche=$remote_commit."
            exit 0
          fi

          bash .github/scripts/publish-article-images.sh \
            "$branch" \
            "$requested_commit" \
            "content-candidates/article-images.json"

          {
            echo "## Bridge images Fam Space"
            echo
            echo "- Résultat: succès"
            echo "- Signal: $signal"
          } >> "$GITHUB_STEP_SUMMARY"
