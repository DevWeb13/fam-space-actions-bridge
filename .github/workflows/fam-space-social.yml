name: Fam Space social publisher

on:
  workflow_run:
    workflows:
      - Fam Space production release
    types:
      - completed
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyser les publications sans rien envoyer à Meta"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fam-space-social-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Vérifier la configuration Meta
        id: meta
        shell: bash
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          if [ -n "$FACEBOOK_PAGE_ACCESS_TOKEN" ] || \
             [ -n "$INSTAGRAM_ACCESS_TOKEN" ] || \
             [ -n "$THREADS_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Au moins un réseau Meta est configuré."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Aucun secret Meta présent: publication ignorée sans erreur."
          fi

      - name: Récupérer le bridge
        if: steps.meta.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          path: bridge
          fetch-depth: 0

      - name: Récupérer Fam Space en production
        if: steps.meta.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: DevWeb13/fam-space-qwik
          ref: production
          token: ${{ secrets.FAM_SPACE_TOKEN }}
          path: fam-space
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.meta.outputs.ready == 'true'
        with:
          node-version: 24

      - name: Publier les nouveaux articles
        if: steps.meta.outputs.ready == 'true'
        shell: bash
        env:
          FAM_SPACE_DIR: ${{ github.workspace }}/fam-space
          FACEBOOK_PAGE_ID: "1314472035081859"
          INSTAGRAM_USER_ID: "28082762261424741"
          THREADS_USER_ID: "28413878778293545"
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          SOCIAL_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && 'true' || 'false' }}
        run: |
          set -uo pipefail

          set +e
          node bridge/scripts/publish-social.mjs bridge/social-state.json
          social_status=$?
          set -e

          cd bridge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-state.json

          if ! git diff --cached --quiet; then
            git commit -m "social: advance publication state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

          exit "$social_status"
