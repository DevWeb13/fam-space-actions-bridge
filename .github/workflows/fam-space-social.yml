name: Fam Space Facebook publisher

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Analyser Facebook sans publier"
        required: false
        default: false
        type: boolean
    secrets:
      FAM_SPACE_TOKEN:
        required: true
      FACEBOOK_PAGE_ACCESS_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyser Facebook sans publier"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: fam-space-facebook-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Vérifier la configuration Facebook
        id: facebook
        shell: bash
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          REQUESTED_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          if [ "$REQUESTED_DRY_RUN" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Mode dry-run: aucun appel de publication Facebook."
          elif [ -n "$FACEBOOK_PAGE_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Token Facebook présent."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::FACEBOOK_PAGE_ACCESS_TOKEN absent."
          fi

      - name: Récupérer le bridge
        if: steps.facebook.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}
          path: bridge
          fetch-depth: 0

      - name: Récupérer Fam Space en production
        if: steps.facebook.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: DevWeb13/fam-space-qwik
          ref: production
          token: ${{ secrets.FAM_SPACE_TOKEN }}
          path: fam-space
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.facebook.outputs.ready == 'true'
        with:
          node-version: 24

      - name: Vérifier le publisher Facebook
        if: steps.facebook.outputs.ready == 'true'
        shell: bash
        run: node --check bridge/scripts/publish-facebook.mjs

      - name: Publier les nouveaux articles sur Facebook
        if: steps.facebook.outputs.ready == 'true'
        shell: bash
        env:
          FAM_SPACE_DIR: ${{ github.workspace }}/fam-space
          LEGACY_SOCIAL_STATE_FILE: ${{ github.workspace }}/bridge/social-state.json
          FACEBOOK_PAGE_ID: "1314472035081859"
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v26.0
          FACEBOOK_MAX_NEW_PER_RUN: 50
          FACEBOOK_BACKFILL_MAX_PER_DAY: 0
          FACEBOOK_BACKFILL_MIN_INTERVAL_HOURS: 0
          FACEBOOK_IMAGE_GRACE_HOURS: 24
          SOCIAL_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -uo pipefail

          set +e
          node bridge/scripts/publish-facebook.mjs bridge/facebook-state.json
          facebook_status=$?
          set -e

          cd bridge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add facebook-state.json

          if ! git diff --cached --quiet; then
            git commit -m "facebook: advance publication state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

          exit "$facebook_status"
