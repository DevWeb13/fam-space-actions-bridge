name: Fam Space social quota audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fam-space-social-quota-audit.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Threads quota
        env:
          TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -fsSG 'https://graph.threads.net/v1.0/me/threads_publishing_limit' \
            --data-urlencode 'fields=quota_usage,config' \
            --data-urlencode "access_token=$TOKEN")
          usage=$(printf '%s' "$response" | jq -r '.data[0].quota_usage')
          total=$(printf '%s' "$response" | jq -r '.data[0].config.quota_total')
          duration=$(printf '%s' "$response" | jq -r '.data[0].config.quota_duration')
          echo "THREADS usage=$usage total=$total duration=$duration"

      - name: Instagram quota
        env:
          TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -fsSG 'https://graph.instagram.com/v26.0/28082762261424741/content_publishing_limit' \
            --data-urlencode 'fields=quota_usage,config' \
            --data-urlencode "access_token=$TOKEN")
          usage=$(printf '%s' "$response" | jq -r '.data[0].quota_usage')
          total=$(printf '%s' "$response" | jq -r '.data[0].config.quota_total')
          duration=$(printf '%s' "$response" | jq -r '.data[0].config.quota_duration')
          echo "INSTAGRAM usage=$usage total=$total duration=$duration"

      - name: Facebook Graph usage
        env:
          TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          headers=$(mktemp)
          curl -fsSG -D "$headers" -o /dev/null 'https://graph.facebook.com/v26.0/1314472035081859' \
            --data-urlencode 'fields=id,name' \
            --data-urlencode "access_token=$TOKEN"
          echo 'FACEBOOK API reachable'
          grep -Ei '^(x-app-usage|x-page-usage|x-business-use-case-usage):' "$headers" || echo 'FACEBOOK no quota headers returned on this read'
