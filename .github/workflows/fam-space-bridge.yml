name: Fam Space bridge

on:
  push:
    branches:
      - main
    paths:
      - bridge-request.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fam-space-master-write
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le signal
        uses: actions/checkout@v4
        with:
          path: bridge

      - name: Récupérer Fam Space
        uses: actions/checkout@v4
        with:
          repository: DevWeb13/fam-space-qwik
          ref: master
          token: ${{ secrets.FAM_SPACE_TOKEN }}
          fetch-depth: 0
          path: fam-space

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fam-space/package-lock.json

      - name: Installer les dépendances
        working-directory: fam-space
        run: npm ci

      - name: Traiter la demande
        working-directory: fam-space
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master '+refs/heads/automation/*:refs/remotes/origin/automation/*' --prune
          git fetch origin --tags --prune

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            request="drain"
          else
            request="$(tail -n 1 ../bridge/bridge-request.txt | tr -d '\r\n')"
          fi

          queue_file="$RUNNER_TEMP/fam-space-bridge-queue.txt"
          : > "$queue_file"

          if [ "$request" = "drain" ]; then
            git for-each-ref \
              --sort=-committerdate \
              --format='%(refname:short)' \
              refs/remotes/origin/automation/ \
              | grep -E '^origin/automation/(publication|review|destination)-' \
              | sed 's#^origin/##' > "$queue_file" || true
          elif [[ "$request" =~ ^automation/(publication|review|destination)- ]]; then
            printf '%s\n' "$request" > "$queue_file"
          else
            echo "Signal invalide: $request" >&2
            exit 1
          fi

          echo "Demande: $request"
          echo "Branches à traiter: $(wc -l < "$queue_file" | tr -d ' ')"
          cat "$queue_file"

          failed=0

          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            echo "::group::Traitement de $branch"

            git fetch origin master '+refs/heads/automation/*:refs/remotes/origin/automation/*' --prune
            git fetch origin --tags --prune

            processed_tag="automation-processed/${branch#automation/}"

            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              if git show-ref --verify --quiet "refs/tags/$processed_tag"; then
                echo "Branche déjà traitée et supprimée: $branch"
                echo "::endgroup::"
                continue
              fi
              echo "Branche introuvable: $branch" >&2
              failed=1
              echo "::endgroup::"
              continue
            fi

            automation_commit="$(git rev-parse "origin/$branch")"

            if git show-ref --verify --quiet "refs/tags/$processed_tag"; then
              processed_commit="$(git rev-parse "refs/tags/$processed_tag")"
              if [ "$processed_commit" != "$automation_commit" ]; then
                echo "Le marqueur $processed_tag ne correspond plus à $branch." >&2
                failed=1
                echo "::endgroup::"
                continue
              fi
              echo "Déjà traitée: $branch"
              git push origin --delete "$branch" || true
              echo "::endgroup::"
              continue
            fi

            automation_parent="$(git rev-parse "${automation_commit}^")"
            mapfile -t changes < <(git diff --name-status "$automation_parent" "$automation_commit")
            if [ "${#changes[@]}" -ne 1 ]; then
              echo "Le commit d'automatisation doit contenir exactement un changement." >&2
              printf '%s\n' "${changes[@]}" >&2
              failed=1
              echo "::endgroup::"
              continue
            fi

            read -r status automation_file <<< "${changes[0]}"
            mode=""

            case "$branch" in
              automation/publication-*)
                if [ "$status" != "A" ] || [ "$automation_file" != "content-candidates/article.md" ]; then
                  echo "Candidat de publication invalide." >&2
                  failed=1
                  echo "::endgroup::"
                  continue
                fi
                if [ "$(git show -s --format=%s "$automation_commit")" != "content: candidate" ]; then
                  echo "Message de commit publication invalide." >&2
                  failed=1
                  echo "::endgroup::"
                  continue
                fi
                mode="publication"
                ;;
              automation/review-*)
                if [ "$status" != "M" ] || [[ ! "$automation_file" =~ ^src/routes/articles/.+/index\.md$ ]]; then
                  echo "Vérification d'article invalide." >&2
                  failed=1
                  echo "::endgroup::"
                  continue
                fi
                slug="$(basename "$(dirname "$automation_file")")"
                if [ "$(git show -s --format=%s "$automation_commit")" != "content: review $slug" ]; then
                  echo "Message de commit review invalide." >&2
                  failed=1
                  echo "::endgroup::"
                  continue
                fi
                mode="review"
                ;;
              automation/destination-*)
                if [ "$status" != "A" ] || [ "$automation_file" != "content-candidates/destination.md" ]; then
                  echo "Candidat Destination invalide." >&2
                  failed=1
                  echo "::endgroup::"
                  continue
                fi
                if [ "$(git show -s --format=%s "$automation_commit")" != "content: destination candidate" ]; then
                  echo "Message de commit Destination invalide." >&2
                  failed=1
                  echo "::endgroup::"
                  continue
                fi
                mode="destination"
                ;;
            esac

            if [ "$mode" = "publication" ] || [ "$mode" = "review" ]; then
              state_tag="automation-state/${branch#automation/}"
              if git show-ref --verify --quiet "refs/tags/$state_tag"; then
                state_commit="$(git rev-parse "refs/tags/$state_tag")"
                if [ "$state_commit" != "$automation_commit" ]; then
                  echo "Le marqueur $state_tag ne correspond plus à $branch." >&2
                  failed=1
                  echo "::endgroup::"
                  continue
                fi
              else
                base_sha="$(git rev-parse origin/master)"
                git checkout -B state-advance origin/master
                git reset --hard origin/master
                git clean -fd

                if [ "$mode" = "publication" ]; then
                  node scripts/advance-publication-state.mjs
                  git add -- \
                    content-data/publication-rotation.json \
                    content-data/publication-category-rotation.json \
                    content-data/publication-workflow.md
                  git commit -m "chore: advance publication assignment"
                else
                  node scripts/advance-review-state.mjs "$automation_file"
                  git add -- content-data/article-review-workflow.md
                  git commit -m "chore: advance review assignment"
                fi

                git fetch origin master
                latest_master_sha="$(git rev-parse origin/master)"
                if [ "$latest_master_sha" != "$base_sha" ]; then
                  echo "master a avancé pendant le changement d'état." >&2
                  failed=1
                  echo "::endgroup::"
                  continue
                fi

                if ! git push origin HEAD:master; then
                  failed=1
                  echo "::endgroup::"
                  continue
                fi
                git tag "$state_tag" "$automation_commit"
                if ! git push origin "refs/tags/$state_tag"; then
                  failed=1
                  echo "::endgroup::"
                  continue
                fi
                git fetch origin master --tags --prune
              fi
            fi

            if [ "$mode" = "review" ]; then
              if ! git cat-file -e "origin/master:$automation_file" 2>/dev/null; then
                echo "Review obsolète: article absent de master."
                git tag "$processed_tag" "$automation_commit"
                git push origin "refs/tags/$processed_tag"
                git push origin --delete "$branch" || true
                echo "::endgroup::"
                continue
              fi
              parent_file_sha="$(git rev-parse "$automation_parent:$automation_file")"
              master_file_sha="$(git rev-parse "origin/master:$automation_file")"
              if [ "$parent_file_sha" != "$master_file_sha" ]; then
                echo "Review obsolète: l'article a déjà changé sur master."
                git tag "$processed_tag" "$automation_commit"
                git push origin "refs/tags/$processed_tag"
                git push origin --delete "$branch" || true
                echo "::endgroup::"
                continue
              fi
            fi

            git checkout -B bridge-runner origin/master
            git reset --hard origin/master
            git clean -fd

            success=false
            case "$mode" in
              publication)
                if bash scripts/publish-queued-publication.sh "$automation_commit" "$automation_file"; then
                  success=true
                fi
                ;;
              review)
                if bash scripts/publish-queued-review.sh "$automation_commit" "$automation_file"; then
                  success=true
                fi
                ;;
              destination)
                if bash .github/scripts/publish-destination-candidate.sh "$automation_commit" "$automation_file"; then
                  success=true
                fi
                ;;
            esac

            if [ "$success" = true ]; then
              git fetch origin --tags --prune
              if ! git show-ref --verify --quiet "refs/tags/$processed_tag"; then
                git tag "$processed_tag" "$automation_commit"
                if ! git push origin "refs/tags/$processed_tag"; then
                  echo "Contenu publié mais marqueur impossible à créer: $branch" >&2
                  failed=1
                fi
              fi
              git push origin --delete "$branch" || true
              echo "Travail publié: $branch"
            else
              echo "Échec du traitement de $branch. La branche est conservée." >&2
              failed=1
            fi

            echo "::endgroup::"
          done < "$queue_file"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
