name: Fam Space bridge

on:
  workflow_dispatch:
    inputs:
      automation_branch:
        description: "Branche Fam Space automation/... à traiter (facultatif)"
        required: false
        type: string
  schedule:
    - cron: "10 * * * *"
    - cron: "25 * * * *"
    - cron: "40 * * * *"

permissions:
  contents: read

concurrency:
  group: fam-space-master-write
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer Fam Space
        uses: actions/checkout@v4
        with:
          repository: DevWeb13/fam-space-qwik
          ref: master
          token: ${{ secrets.FAM_SPACE_TOKEN }}
          fetch-depth: 0

      - name: Récupérer les branches d'automatisation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/automation/*:refs/remotes/origin/automation/*' --prune

      - name: Nettoyer le stock antérieur au bridge
        shell: bash
        run: |
          set -euo pipefail

          cutoff="1786789020"

          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            branch="${ref#origin/}"
            commit_time="$(git show -s --format=%ct "$ref")"

            if [ "$commit_time" -lt "$cutoff" ]; then
              echo "Suppression de l'ancienne branche: $branch"
              git push origin --delete "$branch" || true
            fi
          done < <(
            git for-each-ref --format='%(refname:short)' refs/remotes/origin/automation/ \
              | grep -E '^origin/automation/(publication|review|destination)-' \
              | sort
          )

          git fetch origin '+refs/heads/automation/*:refs/remotes/origin/automation/*' --prune

      - name: Choisir l'automatisation à traiter
        id: select
        shell: bash
        env:
          MANUAL_BRANCH: ${{ github.event.inputs.automation_branch }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          branch=""

          if [ -n "${MANUAL_BRANCH:-}" ]; then
            branch="$MANUAL_BRANCH"

            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              echo "Branche introuvable: $branch" >&2
              exit 1
            fi
          else
            case "${SCHEDULE:-}" in
              "10 * * * *") prefix="automation/publication-" ;;
              "25 * * * *") prefix="automation/destination-" ;;
              "40 * * * *") prefix="automation/review-" ;;
              *)
                echo "Aucune branche manuelle et aucun créneau automatique reconnu."
                echo "found=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac

            branch="$(
              git for-each-ref --format='%(refname:short)' refs/remotes/origin/automation/ \
                | sed 's#^origin/##' \
                | grep -E "^${prefix}" \
                | sort \
                | tail -n 1 \
                || true
            )"

            if [ -z "$branch" ]; then
              echo "Aucune branche récente à traiter."
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            automation_commit="$(git rev-parse "origin/$branch")"
            commit_time="$(git show -s --format=%ct "$automation_commit")"
            now="$(date +%s)"
            age="$((now - commit_time))"

            if [ "$age" -gt 10800 ]; then
              echo "La branche la plus récente est trop ancienne (${age}s): $branch"
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Branche sélectionnée: $branch"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "AUTOMATION_BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Charger la branche sélectionnée
        if: steps.select.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B bridge-automation "origin/$AUTOMATION_BRANCH"

      - name: Identifier et valider l'automatisation
        if: steps.select.outputs.found == 'true'
        id: automation
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin master

          mapfile -t automation_commits < <(git rev-list --reverse origin/master..HEAD)
          if [ "${#automation_commits[@]}" -ne 1 ]; then
            echo "La branche doit contenir exactement un commit d'automatisation."
            exit 1
          fi

          mapfile -t changes < <(git diff --name-status origin/master...HEAD)
          if [ "${#changes[@]}" -ne 1 ]; then
            echo "La branche doit contenir exactement un changement."
            printf '%s\n' "${changes[@]}"
            exit 1
          fi

          automation_commit="${automation_commits[0]}"
          read -r status automation_file <<< "${changes[0]}"

          case "$AUTOMATION_BRANCH" in
            automation/publication-*)
              if [ "$status" != "A" ] || [ "$automation_file" != "content-candidates/article.md" ]; then
                echo "Candidat de publication invalide."
                exit 1
              fi
              echo "mode=publication" >> "$GITHUB_OUTPUT"
              ;;

            automation/review-*)
              if [ "$status" != "M" ] || [[ ! "$automation_file" =~ ^src/routes/articles/.+/index\.md$ ]]; then
                echo "Vérification d'article invalide."
                exit 1
              fi
              echo "mode=review" >> "$GITHUB_OUTPUT"
              ;;

            automation/destination-*)
              if [ "$status" != "A" ] || [ "$automation_file" != "content-candidates/destination.md" ]; then
                echo "Candidat Destination invalide."
                exit 1
              fi

              actual_message="$(git show -s --format=%s "$automation_commit")"
              if [ "$actual_message" != "content: destination candidate" ]; then
                echo "Message de commit Destination invalide: $actual_message"
                exit 1
              fi

              echo "mode=destination" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "Branche d'automatisation invalide: $AUTOMATION_BRANCH"
              exit 1
              ;;
          esac

          echo "AUTOMATION_COMMIT=$automation_commit" >> "$GITHUB_ENV"
          echo "AUTOMATION_FILE=$automation_file" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: steps.select.outputs.found == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        if: steps.select.outputs.found == 'true'
        run: npm ci

      - name: Publier l'article
        if: steps.select.outputs.found == 'true' && steps.automation.outputs.mode == 'publication'
        shell: bash
        run: |
          bash .github/scripts/publish-automated-article.sh \
            "$AUTOMATION_COMMIT" \
            "$AUTOMATION_FILE"

      - name: Publier la vérification
        if: steps.select.outputs.found == 'true' && steps.automation.outputs.mode == 'review'
        shell: bash
        run: |
          bash .github/scripts/publish-reviewed-article.sh \
            "$AUTOMATION_COMMIT" \
            "$AUTOMATION_FILE"

      - name: Publier la Destination
        if: steps.select.outputs.found == 'true' && steps.automation.outputs.mode == 'destination'
        shell: bash
        run: |
          bash .github/scripts/publish-destination-candidate.sh \
            "$AUTOMATION_COMMIT" \
            "$AUTOMATION_FILE"

      - name: Supprimer la branche temporaire
        if: success() && steps.select.outputs.found == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if git push origin --delete "$AUTOMATION_BRANCH"; then
              exit 0
            fi

            echo "Tentative $attempt de suppression de la branche temporaire échouée."
            sleep 2
          done

          echo "::warning::Publication réussie, mais la branche temporaire n'a pas pu être supprimée."
          exit 0
