name: Fam Space bridge

on:
  push:
    branches:
      - main
    paths:
      - bridge-request.txt
  workflow_dispatch:
    inputs:
      automation_branch:
        description: "Branche automation précise à traiter"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fam-space-master-write
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le signal
        uses: actions/checkout@v4
        with:
          path: bridge

      - name: Récupérer Fam Space
        uses: actions/checkout@v4
        with:
          repository: DevWeb13/fam-space-qwik
          ref: master
          token: ${{ secrets.FAM_SPACE_TOKEN }}
          fetch-depth: 0
          path: fam-space

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fam-space/package-lock.json

      - name: Installer les dépendances
        working-directory: fam-space
        run: npm ci

      - name: Traiter la branche demandée
        working-directory: fam-space
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BRANCH: ${{ github.event.inputs.automation_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master '+refs/heads/automation/*:refs/remotes/origin/automation/*' --prune
          git fetch origin --tags --prune

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            branch="$MANUAL_BRANCH"
          else
            branch="$(tail -n 1 ../bridge/bridge-request.txt | tr -d '\r\n')"
          fi

          if [[ ! "$branch" =~ ^automation/(publication|review|destination)- ]]; then
            echo "Branche demandée invalide: $branch" >&2
            exit 1
          fi

          processed_tag="automation-processed/${branch#automation/}"

          mark_processed() {
            local commit="$1"
            git fetch origin --tags --prune
            if ! git show-ref --verify --quiet "refs/tags/$processed_tag"; then
              git tag "$processed_tag" "$commit"
              git push origin "refs/tags/$processed_tag"
            fi
            git push origin --delete "$branch" || true
          }

          if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            if git show-ref --verify --quiet "refs/tags/$processed_tag"; then
              echo "Branche déjà traitée et supprimée: $branch"
              exit 0
            fi
            echo "Branche introuvable: $branch" >&2
            exit 1
          fi

          automation_commit="$(git rev-parse "origin/$branch")"
          if git show-ref --verify --quiet "refs/tags/$processed_tag"; then
            processed_commit="$(git rev-parse "refs/tags/$processed_tag")"
            if [ "$processed_commit" != "$automation_commit" ]; then
              echo "Le marqueur $processed_tag ne correspond plus à $branch." >&2
              exit 1
            fi
            git push origin --delete "$branch" || true
            echo "Branche déjà traitée: $branch"
            exit 0
          fi

          automation_parent="$(git rev-parse "${automation_commit}^")"
          mapfile -t changes < <(git diff --name-status "$automation_parent" "$automation_commit")
          if [ "${#changes[@]}" -ne 1 ]; then
            echo "Le commit d'automatisation doit contenir exactement un changement." >&2
            printf '%s\n' "${changes[@]}" >&2
            exit 1
          fi

          read -r status automation_file <<< "${changes[0]}"
          mode=""

          case "$branch" in
            automation/publication-*)
              if [ "$status" = "A" ] && [ "$automation_file" = "content-candidates/publication-stage.md" ]; then
                mode="publication_stage"
              elif [ "$status" = "A" ] && [ "$automation_file" = "content-candidates/publication-skip.txt" ]; then
                skip_value="$(git show "$automation_commit:$automation_file" | tr -d '\r\n[:space:]')"
                if [[ "$skip_value" =~ ^[0-9]+$ ]]; then
                  skip_position="$skip_value"
                elif [ "$skip_value" = "skip" ]; then
                  skip_position="$(
                    git show "$automation_parent:content-data/publication-rotation.json" \
                      | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(String(JSON.parse(s).position)))'
                  )"
                else
                  echo "Marqueur sans candidat invalide: $skip_value" >&2
                  exit 1
                fi
                mode="publication_skip"
              else
                echo "Publication d'automatisation invalide: ${changes[0]}" >&2
                exit 1
              fi
              ;;
            automation/review-*)
              if [ "$status" != "M" ] || [[ ! "$automation_file" =~ ^src/routes/articles/.+/index\.md$ ]]; then
                echo "Vérification d'article invalide: ${changes[0]}" >&2
                exit 1
              fi
              mode="review"
              ;;
            automation/destination-*)
              if [ "$status" != "A" ] || [ "$automation_file" != "content-candidates/destination.md" ]; then
                echo "Candidat Destination invalide: ${changes[0]}" >&2
                exit 1
              fi
              mode="destination"
              ;;
          esac

          if [ "$mode" = "publication_skip" ]; then
            current_phase="$(
              git show "origin/master:content-data/publication-phase.json"                 | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(String(JSON.parse(s).phase)))'
            )"
            if [ "$current_phase" != "1" ]; then
              echo "Un skip n'est autorisé qu'en phase 1; phase courante: $current_phase." >&2
              exit 1
            fi
          fi

          if [ "$mode" = "review" ]; then
            git fetch origin master
            if ! git cat-file -e "origin/master:$automation_file" 2>/dev/null; then
              echo "Review obsolète: article absent de master."
              mark_processed "$automation_commit"
              exit 0
            fi
            parent_file_sha="$(git rev-parse "$automation_parent:$automation_file")"
            master_file_sha="$(git rev-parse "origin/master:$automation_file")"
            if [ "$parent_file_sha" != "$master_file_sha" ]; then
              echo "Review obsolète: l'article a déjà changé sur master."
              mark_processed "$automation_commit"
              exit 0
            fi
          fi

          git checkout -B bridge-runner origin/master
          git reset --hard origin/master
          git clean -fd

          case "$mode" in
            publication_stage)
              bash .github/scripts/process-publication-stage.sh "$automation_commit" "$automation_file"
              ;;
            publication_skip)
              bash .github/scripts/skip-publication-assignment.sh "$skip_position"
              ;;
            review)
              bash .github/scripts/publish-reviewed-article.sh "$automation_commit" "$automation_file"
              ;;
            destination)
              bash .github/scripts/publish-destination-candidate.sh "$automation_commit" "$automation_file"
              ;;
          esac

          mark_processed "$automation_commit"
          echo "Travail publié: $branch"
