name: Fam Space bridge

on:
  push:
    branches:
      - main
    paths:
      - bridge-request.txt
  workflow_dispatch:
    inputs:
      automation_branch:
        description: "Branche automation précise à traiter"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fam-space-master-write
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le signal
        uses: actions/checkout@v4
        with:
          path: bridge

      - name: Récupérer Fam Space
        uses: actions/checkout@v4
        with:
          repository: DevWeb13/fam-space-qwik
          ref: master
          token: ${{ secrets.FAM_SPACE_TOKEN }}
          fetch-depth: 0
          path: fam-space

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fam-space/package-lock.json

      - name: Installer les dépendances
        working-directory: fam-space
        run: npm ci --no-audit --no-fund

      - name: Traiter la branche demandée
        working-directory: fam-space
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BRANCH: ${{ github.event.inputs.automation_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          requested_commit=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            branch="$MANUAL_BRANCH"
          else
            signal="$(tail -n 1 ../bridge/bridge-request.txt | tr -d '\r\n')"
            if [[ "$signal" == *"|"* ]]; then
              IFS='|' read -r branch requested_commit request_nonce <<< "$signal"
            else
              branch="$signal"
            fi
          fi

          if [[ ! "$branch" =~ ^automation/(publication|destination)- ]]; then
            echo "Branche demandée invalide: $branch" >&2
            exit 1
          fi

          branch_exists=true
          if ! git fetch origin master             "+refs/heads/$branch:refs/remotes/origin/$branch"; then
            branch_exists=false
            git fetch origin master
          fi

          update_publication_ready() {
            git checkout -B publication-runtime-source origin/master
            git reset --hard origin/master
            git clean -fd
            node scripts/render-publication-runtime.mjs               --phase 1               --output "$RUNNER_TEMP/publication-runtime.md"

            for attempt in 1 2 3; do
              if (
                cd ../bridge
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git fetch origin main
                git checkout -B publication-ready origin/main
                printf '{\n  "phase": 1\n}\n' > publication-state.json
                cp "$RUNNER_TEMP/publication-runtime.md" publication-runtime.md
                git add publication-state.json publication-runtime.md
                if git diff --cached --quiet; then
                  exit 0
                fi
                git commit -m "state: Publication ready"
                git push origin HEAD:main
              ); then
                return 0
              fi
            done

            echo "Impossible de remettre Publication en phase 1." >&2
            return 1
          }

          if [[ "$branch" =~ ^automation/publication- ]]; then
            completed_tag="automation-completed/${branch#automation/}"
            git fetch origin "refs/tags/$completed_tag:refs/tags/$completed_tag" 2>/dev/null || true

            if [ "$branch_exists" != true ]; then
              if git show-ref --verify --quiet "refs/tags/$completed_tag"; then
                update_publication_ready
                echo "Publication déjà finalisée: $branch"
                exit 0
              fi
              echo "Branche Publication introuvable: $branch" >&2
              exit 1
            fi

            automation_commit="$(git rev-parse "origin/$branch")"
            if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
              if [[ ! "$requested_commit" =~ ^[0-9a-f]{40}$ ]] ||
                 [ "$requested_commit" != "$automation_commit" ]; then
                echo "Signal Publication obsolète ou invalide." >&2
                exit 1
              fi
            fi

            state_file="../bridge/publication-state.json"
            phase="$(node ../fam-space/scripts/process-publication-request.mjs state-read "$state_file" phase)"
            active_branch="$(node ../fam-space/scripts/process-publication-request.mjs state-read "$state_file" activeBranch)"
            if [ "$phase" != "4" ] || [ "$active_branch" != "$branch" ]; then
              echo "État Publication incohérent pour la finalisation." >&2
              exit 1
            fi

            subject="$(git log -1 --format=%s "$automation_commit")"
            parent="$(git rev-parse "${automation_commit}^")"
            parent_subject="$(git log -1 --format=%s "$parent")"
            if [[ "$subject" != publication:\ phase\ 4* ]] ||
               [[ "$parent_subject" != publication:\ phase\ 3* ]]; then
              echo "La branche Publication n'est pas prête pour la phase finale." >&2
              exit 1
            fi

            stage_file="content-candidates/publication-stage.md"
            mapfile -t changes < <(git diff --name-status "$parent" "$automation_commit")
            if [ "${#changes[@]}" -eq 1 ]; then
              read -r status path <<< "${changes[0]}"
              if [ "$status" != "M" ] || [ "$path" != "$stage_file" ]; then
                echo "La phase 4 doit uniquement remplacer le candidat Publication." >&2
                exit 1
              fi
            elif [ "${#changes[@]}" -eq 0 ]; then
              parent_stage="$(git rev-parse "$parent:$stage_file" 2>/dev/null || true)"
              current_stage="$(git rev-parse "$automation_commit:$stage_file" 2>/dev/null || true)"
              if [ -z "$parent_stage" ] || [ "$parent_stage" != "$current_stage" ]; then
                echo "Phase 4 vide invalide." >&2
                exit 1
              fi
            else
              echo "La phase 4 Publication contient des changements inattendus." >&2
              exit 1
            fi

            if git show-ref --verify --quiet "refs/tags/$completed_tag"; then
              git push origin --delete "$branch" || true
              update_publication_ready
              echo "Publication déjà finalisée: $branch"
              exit 0
            fi

            bash .github/scripts/process-publication-stage.sh               "$automation_commit" "$stage_file" "$branch"

            git tag "$completed_tag" "$automation_commit"
            git push origin "refs/tags/$completed_tag"
            git push origin --delete "$branch" || true
            git fetch origin master
            update_publication_ready
            echo "Publication finalisée et branche supprimée: $branch"
            exit 0
          fi

          processed_tag="automation-processed/${branch#automation/}"
          git fetch origin "refs/tags/$processed_tag:refs/tags/$processed_tag" 2>/dev/null || true

          if [ "$branch_exists" != true ]; then
            if git show-ref --verify --quiet "refs/tags/$processed_tag"; then
              echo "Destination déjà traitée et supprimée: $branch"
              exit 0
            fi
            echo "Branche Destination introuvable: $branch" >&2
            exit 1
          fi

          automation_commit="$(git rev-parse "origin/$branch")"
          automation_parent="$(git rev-parse "${automation_commit}^")"
          mapfile -t changes < <(
            git diff --name-status "$automation_parent" "$automation_commit"
          )
          if [ "${#changes[@]}" -ne 1 ]; then
            echo "Le commit Destination doit contenir exactement un changement." >&2
            exit 1
          fi

          read -r status automation_file <<< "${changes[0]}"
          if [ "$status" != "A" ] ||
             [ "$automation_file" != "content-candidates/destination.md" ]; then
            echo "Candidat Destination invalide: ${changes[0]}" >&2
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/$processed_tag"; then
            git push origin --delete "$branch" || true
            echo "Destination déjà traitée: $branch"
            exit 0
          fi

          git checkout -B bridge-runner origin/master
          git reset --hard origin/master
          git clean -fd
          bash .github/scripts/publish-destination-candidate.sh             "$automation_commit" "$automation_file"

          git tag "$processed_tag" "$automation_commit"
          git push origin "refs/tags/$processed_tag"
          git push origin --delete "$branch" || true
          echo "Destination publiée et branche supprimée: $branch"
