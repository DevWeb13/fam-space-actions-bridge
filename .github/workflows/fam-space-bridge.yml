name: Fam Space bridge

on:
  push:
    branches:
      - main
    paths:
      - bridge-request.txt
  workflow_dispatch:
    inputs:
      automation_branch:
        description: "Branche automation précise à traiter"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fam-space-master-write
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le signal
        uses: actions/checkout@v4
        with:
          path: bridge

      - name: Récupérer Fam Space
        uses: actions/checkout@v4
        with:
          repository: DevWeb13/fam-space-qwik
          ref: master
          token: ${{ secrets.FAM_SPACE_TOKEN }}
          fetch-depth: 0
          path: fam-space

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fam-space/package-lock.json

      - name: Installer les dépendances
        working-directory: fam-space
        run: npm ci

      - name: Traiter la branche demandée
        working-directory: fam-space
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BRANCH: ${{ github.event.inputs.automation_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master '+refs/heads/automation/*:refs/remotes/origin/automation/*' --prune
          git fetch origin --tags --prune

          publication_state_file="../bridge/publication-state.json"

          read_publication_state() {
            if [ -f "$publication_state_file" ]; then
              cat "$publication_state_file"
            else
              git show "origin/master:content-data/publication-phase.json"
            fi
          }

          write_publication_state() {
            local next_phase="$1"
            local active_branch="${2:-}"
            local last_processed="${3:-}"
            local attempt

            for attempt in 1 2 3; do
              if (
                cd ../bridge
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git fetch origin main
                git checkout -B publication-state-update origin/main
                if [ "$next_phase" = "1" ]; then
                  printf '{\n  "phase": 1\n}\n' > publication-state.json
                else
                  PHASE="$next_phase" ACTIVE_BRANCH="$active_branch" LAST_PROCESSED="$last_processed" node - <<'NODE'
const fs = require("node:fs");
const value = {
  phase: Number(process.env.PHASE),
  activeBranch: process.env.ACTIVE_BRANCH,
  lastProcessedCommit: process.env.LAST_PROCESSED,
};
fs.writeFileSync("publication-state.json", JSON.stringify(value, null, 2) + "\n");
NODE
                fi
                git add publication-state.json
                if git diff --cached --quiet; then
                  exit 0
                fi
                git commit -m "state: publication phase $next_phase"
                git push origin HEAD:main
              ); then
                return 0
              fi
            done

            echo "Impossible de mettre à jour publication-state.json après 3 tentatives." >&2
            return 1
          }

          requested_commit=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            branch="$MANUAL_BRANCH"
          else
            signal="$(tail -n 1 ../bridge/bridge-request.txt | tr -d '\r\n')"
            if [[ "$signal" == *"|"* ]]; then
              branch="${signal%%|*}"
              requested_commit="${signal#*|}"
            else
              branch="$signal"
            fi
          fi

          if [[ ! "$branch" =~ ^automation/(publication|destination)- ]]; then
            echo "Branche demandée invalide: $branch" >&2
            exit 1
          fi

          base_processed_tag="automation-processed/${branch#automation/}"
          completed_tag="automation-completed/${branch#automation/}"
          publication_branch=false
          publication_phase=""
          current_active=""
          last_processed_commit=""
          if [[ "$branch" =~ ^automation/publication- ]]; then
            publication_branch=true
            current_state="$(read_publication_state)"
            publication_phase="$(printf '%s' "$current_state" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(String(JSON.parse(s).phase)))')"
            current_active="$(printf '%s' "$current_state" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).activeBranch || ""))')"
            last_processed_commit="$(printf '%s' "$current_state" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).lastProcessedCommit || ""))')"
          fi

          if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            if [ "$publication_branch" = true ]; then
              if git show-ref --verify --quiet "refs/tags/$completed_tag"; then
                if [ "$publication_phase" != "1" ] || [ -n "$current_active" ]; then
                  write_publication_state 1
                fi
                echo "Branche de publication déjà finalisée et supprimée: $branch"
                exit 0
              fi
            elif git show-ref --verify --quiet "refs/tags/$base_processed_tag"; then
              echo "Branche déjà traitée et supprimée: $branch"
              exit 0
            fi
            echo "Branche introuvable: $branch" >&2
            exit 1
          fi

          automation_commit="$(git rev-parse "origin/$branch")"
          automation_parent="$(git rev-parse "${automation_commit}^")"

          if [ "$publication_branch" = true ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            if [[ ! "$requested_commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Signal Publication invalide: SHA de phase absent ou invalide." >&2
              exit 1
            fi
            if [ "$requested_commit" != "$automation_commit" ]; then
              echo "Signal Publication obsolète: demandé=$requested_commit, branche=$automation_commit." >&2
              exit 1
            fi
          fi

          if [ "$publication_branch" = true ]; then
            processed_tag="$base_processed_tag/$automation_commit"
          else
            processed_tag="$base_processed_tag"
          fi

          mark_processed() {
            local commit="$1"
            local delete_branch="$2"

            git fetch origin --tags --prune
            if ! git show-ref --verify --quiet "refs/tags/$processed_tag"; then
              git tag "$processed_tag" "$commit"
              git push origin "refs/tags/$processed_tag"
            fi

            if [ "$delete_branch" = true ]; then
              if [ "$publication_branch" = true ] && ! git show-ref --verify --quiet "refs/tags/$completed_tag"; then
                git tag "$completed_tag" "$commit"
                git push origin "refs/tags/$completed_tag"
              fi
              git push origin --delete "$branch" || true
            fi
          }

          has_processed_publication_ancestor() {
            local candidate_commit="$1"
            local tag_ref
            local tagged_commit

            if [ -n "$last_processed_commit" ] && git merge-base --is-ancestor "$last_processed_commit" "$candidate_commit"; then
              return 0
            fi

            while IFS= read -r tag_ref; do
              [ -n "$tag_ref" ] || continue
              tagged_commit="$(git rev-parse "$tag_ref^{commit}" 2>/dev/null || true)"
              if [ -n "$tagged_commit" ] && git merge-base --is-ancestor "$tagged_commit" "$candidate_commit"; then
                return 0
              fi
            done < <(git for-each-ref --format='%(refname)' "refs/tags/$base_processed_tag/")

            return 1
          }

          if git show-ref --verify --quiet "refs/tags/$processed_tag"; then
            if [ "$publication_branch" = true ]; then
              if [ "$last_processed_commit" = "$automation_commit" ]; then
                echo "Commit de phase déjà traité et état déjà avancé: $branch"
                exit 0
              fi

              if [ "$publication_phase" -lt 4 ]; then
                write_publication_state "$((publication_phase + 1))" "$branch" "$automation_commit"
                echo "Commit de phase déjà traité; état du bridge réparé vers la phase $((publication_phase + 1))."
                exit 0
              fi

              mark_processed "$automation_commit" true
              write_publication_state 1
              echo "Phase finale déjà traitée; état du bridge remis en phase 1."
            else
              git push origin --delete "$branch" || true
              echo "Branche déjà traitée: $branch"
            fi
            exit 0
          fi

          mapfile -t changes < <(git diff --name-status "$automation_parent" "$automation_commit")
          allow_empty_publication_phase=false
          status=""
          automation_file=""

          if [ "$publication_branch" = true ] && [ "${#changes[@]}" -eq 0 ]; then
            current_phase="$publication_phase"
            stage_file="content-candidates/publication-stage.md"

            if { [ "$current_phase" = "3" ] || [ "$current_phase" = "4" ]; } && [ "$current_active" = "$branch" ]; then
              parent_stage="$(git rev-parse "$automation_parent:$stage_file" 2>/dev/null || true)"
              commit_stage="$(git rev-parse "$automation_commit:$stage_file" 2>/dev/null || true)"
              if [ -n "$parent_stage" ] && [ "$parent_stage" = "$commit_stage" ] && has_processed_publication_ancestor "$automation_commit"; then
                allow_empty_publication_phase=true
                status="M"
                automation_file="$stage_file"
                if [ "$current_phase" = "3" ]; then
                  echo "::warning::Phase 3 sans modification éditoriale: candidat inchangé accepté pour poursuivre vers la phase 4."
                else
                  echo "Phase 4 sans correction éditoriale: candidat inchangé explicitement accepté."
                fi
              fi
            fi
          fi

          if [ "${#changes[@]}" -eq 1 ]; then
            read -r status automation_file <<< "${changes[0]}"
          elif [ "$allow_empty_publication_phase" != true ]; then
            echo "Le commit d'automatisation doit contenir exactement un changement, sauf candidat inchangé validé en phase 3 ou 4." >&2
            printf '%s\n' "${changes[@]}" >&2
            exit 1
          fi

          mode=""

          case "$branch" in
            automation/publication-*)
              current_phase="$publication_phase"

              if [[ "$automation_file" = "content-candidates/publication-stage.md" && "$status" =~ ^(A|M)$ ]]; then
                mode="publication_stage"
                publication_phase="$current_phase"

                if [ "$current_phase" = "1" ]; then
                  if [ "$status" != "A" ] || [ -n "$current_active" ]; then
                    echo "La phase 1 doit ajouter un nouveau candidat sur une nouvelle branche." >&2
                    exit 1
                  fi

                  parent_rotation="$(git rev-parse "$automation_parent:content-data/publication-rotation.json" 2>/dev/null || true)"
                  master_rotation="$(git rev-parse "origin/master:content-data/publication-rotation.json" 2>/dev/null || true)"
                  parent_workflow="$(git rev-parse "$automation_parent:content-data/publication-workflow.md" 2>/dev/null || true)"
                  master_workflow="$(git rev-parse "origin/master:content-data/publication-workflow.md" 2>/dev/null || true)"
                  if [ "$parent_rotation" != "$master_rotation" ] || [ "$parent_workflow" != "$master_workflow" ]; then
                    echo "Branche de phase 1 devenue obsolète: affectation ou rotation modifiée."
                    mark_processed "$automation_commit" true
                    exit 0
                  fi
                else
                  if [ "$status" != "M" ]; then
                    echo "Les phases 2 à 4 doivent remplacer le candidat existant sur la même branche." >&2
                    exit 1
                  fi
                  if [ "$current_active" != "$branch" ]; then
                    echo "Branche de publication incorrecte: active=$current_active, reçue=$branch." >&2
                    exit 1
                  fi
                  if ! has_processed_publication_ancestor "$automation_commit"; then
                    echo "Aucune phase validée de cette branche n'est dans l'historique du candidat." >&2
                    exit 1
                  fi
                fi
              elif [ "$status" = "A" ] && [ "$automation_file" = "content-candidates/publication-skip.txt" ]; then
                if [ "$current_phase" != "1" ] || [ -n "$current_active" ]; then
                  echo "Un skip n'est autorisé qu'en phase 1 sans branche active." >&2
                  exit 1
                fi
                skip_value="$(git show "$automation_commit:$automation_file" | tr -d '\r\n[:space:]')"
                if [[ "$skip_value" =~ ^[0-9]+$ ]]; then
                  skip_position="$skip_value"
                elif [ "$skip_value" = "skip" ]; then
                  skip_position="$(
                    git show "$automation_parent:content-data/publication-rotation.json" \
                      | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(String(JSON.parse(s).position)))'
                  )"
                else
                  echo "Marqueur sans candidat invalide: $skip_value" >&2
                  exit 1
                fi
                mode="publication_skip"
              else
                echo "Publication d'automatisation invalide: ${changes[0]}" >&2
                exit 1
              fi
              ;;
            automation/destination-*)
              if [ "$status" != "A" ] || [ "$automation_file" != "content-candidates/destination.md" ]; then
                echo "Candidat Destination invalide: ${changes[0]}" >&2
                exit 1
              fi
              mode="destination"
              ;;
          esac

          git checkout -B bridge-runner origin/master
          git reset --hard origin/master
          git clean -fd

          case "$mode" in
            publication_stage)
              bash .github/scripts/process-publication-stage.sh "$automation_commit" "$automation_file" "$branch" "$publication_phase"
              ;;
            publication_skip)
              bash .github/scripts/skip-publication-assignment.sh "$skip_position"
              ;;
            destination)
              bash .github/scripts/publish-destination-candidate.sh "$automation_commit" "$automation_file"
              ;;
          esac

          delete_branch=true
          if [ "$mode" = "publication_stage" ] && [ "$publication_phase" -lt 4 ]; then
            delete_branch=false
          fi

          if [ "$mode" = "publication_stage" ]; then
            if [ "$publication_phase" -lt 4 ]; then
              write_publication_state "$((publication_phase + 1))" "$branch" "$automation_commit"
            else
              write_publication_state 1
            fi
          fi

          mark_processed "$automation_commit" "$delete_branch"

          if [ "$delete_branch" = true ]; then
            echo "Travail publié et branche supprimée: $branch"
          else
            echo "Phase $publication_phase traitée hors master; branche conservée pour la phase suivante: $branch"
          fi
