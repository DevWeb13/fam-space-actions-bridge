name: Fam Space bridge

on:
  push:
    branches:
      - main
    paths:
      - bridge-request.txt
  workflow_dispatch:
    inputs:
      automation_branch:
        description: "Branche Fam Space automation/... à traiter (facultatif)"
        required: false
        type: string
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read

concurrency:
  group: fam-space-master-write
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer la demande du bridge
        uses: actions/checkout@v4
        with:
          path: bridge

      - name: Récupérer Fam Space
        uses: actions/checkout@v4
        with:
          repository: DevWeb13/fam-space-qwik
          ref: master
          token: ${{ secrets.FAM_SPACE_TOKEN }}
          fetch-depth: 0
          path: fam-space

      - name: Récupérer les branches d'automatisation
        working-directory: fam-space
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/automation/*:refs/remotes/origin/automation/*' --prune

      - name: Préparer la file à traiter
        id: queue
        working-directory: fam-space
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BRANCH: ${{ github.event.inputs.automation_branch }}
        run: |
          set -euo pipefail

          request=""
          if [ "$EVENT_NAME" = "push" ]; then
            request="$(tail -n 1 ../bridge/bridge-request.txt | tr -d '\r\n')"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${MANUAL_BRANCH:-}" ]; then
            request="$MANUAL_BRANCH"
          fi

          queue_file="$RUNNER_TEMP/fam-space-bridge-queue.txt"
          : > "$queue_file"

          if [ -n "$request" ]; then
            if [[ ! "$request" =~ ^automation/(publication|review|destination)- ]]; then
              echo "Branche demandée invalide: $request" >&2
              exit 1
            fi

            if git show-ref --verify --quiet "refs/remotes/origin/$request"; then
              printf '%s\n' "$request" > "$queue_file"
            else
              echo "La branche demandée n'existe plus: $request"
            fi
          else
            git for-each-ref \
              --sort=committerdate \
              --format='%(refname:short)' \
              refs/remotes/origin/automation/ \
              | sed 's#^origin/##' \
              | grep -E '^automation/(publication|review|destination)-' \
              > "$queue_file" || true
          fi

          count="$(wc -l < "$queue_file" | tr -d ' ')"
          echo "Branches à traiter: $count"
          cat "$queue_file"
          echo "queue_file=$queue_file" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fam-space/package-lock.json

      - name: Installer les dépendances
        working-directory: fam-space
        run: npm ci

      - name: Publier la file
        working-directory: fam-space
        shell: bash
        env:
          QUEUE_FILE: ${{ steps.queue.outputs.queue_file }}
        run: |
          set -euo pipefail

          failed=0

          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            echo "::group::Traitement de $branch"

            git fetch origin master '+refs/heads/automation/*:refs/remotes/origin/automation/*' --prune

            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              echo "Branche déjà traitée ou supprimée: $branch"
              echo "::endgroup::"
              continue
            fi

            automation_commit="$(git rev-parse "origin/$branch")"
            mapfile -t automation_commits < <(git rev-list --reverse origin/master.."origin/$branch")

            if [ "${#automation_commits[@]}" -eq 0 ]; then
              echo "Branche temporaire déjà absorbée par master: $branch"
              if ! git push origin --delete "$branch"; then
                echo "::warning::Impossible de supprimer la branche temporaire déjà absorbée: $branch"
              fi
              echo "::endgroup::"
              continue
            fi

            if [ "${#automation_commits[@]}" -ne 1 ] || [ "${automation_commits[0]}" != "$automation_commit" ]; then
              echo "La branche doit contenir exactement un commit d'automatisation au-dessus de master." >&2
              failed=1
              echo "::endgroup::"
              continue
            fi

            automation_parent="$(git rev-parse "${automation_commit}^")"
            mapfile -t changes < <(git diff --name-status "$automation_parent" "$automation_commit")
            if [ "${#changes[@]}" -ne 1 ]; then
              echo "Le commit d'automatisation doit contenir exactement un changement." >&2
              printf '%s\n' "${changes[@]}" >&2
              failed=1
              echo "::endgroup::"
              continue
            fi

            read -r status automation_file <<< "${changes[0]}"
            mode=""

            case "$branch" in
              automation/publication-*)
                if [ "$status" != "A" ] || [ "$automation_file" != "content-candidates/article.md" ]; then
                  echo "Candidat de publication invalide." >&2
                  failed=1
                  echo "::endgroup::"
                  continue
                fi
                mode="publication"
                ;;
              automation/review-*)
                if [ "$status" != "M" ] || [[ ! "$automation_file" =~ ^src/routes/articles/.+/index\.md$ ]]; then
                  echo "Vérification d'article invalide." >&2
                  failed=1
                  echo "::endgroup::"
                  continue
                fi
                mode="review"
                ;;
              automation/destination-*)
                if [ "$status" != "A" ] || [ "$automation_file" != "content-candidates/destination.md" ]; then
                  echo "Candidat Destination invalide." >&2
                  failed=1
                  echo "::endgroup::"
                  continue
                fi
                actual_message="$(git show -s --format=%s "$automation_commit")"
                if [ "$actual_message" != "content: destination candidate" ]; then
                  echo "Message de commit Destination invalide: $actual_message" >&2
                  failed=1
                  echo "::endgroup::"
                  continue
                fi
                mode="destination"
                ;;
            esac

            # La plomberie est toujours exécutée depuis le master courant.
            # La branche d'automatisation ne fournit que son unique commit de contenu.
            git checkout -B bridge-runner origin/master
            git reset --hard origin/master
            git clean -fd

            success=false
            case "$mode" in
              publication)
                if bash .github/scripts/publish-automated-article.sh "$automation_commit" "$automation_file"; then
                  success=true
                fi
                ;;
              review)
                if bash .github/scripts/publish-reviewed-article.sh "$automation_commit" "$automation_file"; then
                  success=true
                fi
                ;;
              destination)
                if bash .github/scripts/publish-destination-candidate.sh "$automation_commit" "$automation_file"; then
                  success=true
                fi
                ;;
            esac

            if [ "$success" = true ]; then
              if ! git push origin --delete "$branch"; then
                echo "::warning::Travail publié mais branche temporaire non supprimée: $branch"
              fi
            else
              echo "::error::Échec du traitement de $branch. Les autres demandes restent indépendantes."
              failed=1
            fi

            echo "::endgroup::"
          done < "$QUEUE_FILE"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
