name: Fam Space bridge

on:
  push:
    branches:
      - main
    paths:
      - bridge-request.txt
  workflow_dispatch:
  schedule:
    - cron: "45 * * * *"

permissions:
  contents: read

concurrency:
  group: fam-space-master-write
  cancel-in-progress: false

jobs:
  advance-state:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le signal
        uses: actions/checkout@v4
        with:
          path: bridge

      - name: Récupérer Fam Space
        uses: actions/checkout@v4
        with:
          repository: DevWeb13/fam-space-qwik
          ref: master
          token: ${{ secrets.FAM_SPACE_TOKEN }}
          fetch-depth: 0
          path: fam-space

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Avancer les états des branches terminées
        working-directory: fam-space
        shell: bash
        run: |
          set -euo pipefail

          request="$(tail -n 1 ../bridge/bridge-request.txt | tr -d '\r\n')"
          if [[ ! "$request" =~ ^automation/(publication|review)- ]]; then
            echo "Signal invalide: $request" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master '+refs/heads/automation/*:refs/remotes/origin/automation/*' --prune
          git fetch origin --tags --prune

          queue_file="$RUNNER_TEMP/fam-space-state-queue.txt"
          : > "$queue_file"

          while IFS= read -r remote_ref; do
            [ -n "$remote_ref" ] || continue
            branch="${remote_ref#origin/}"
            automation_commit="$(git rev-parse "$remote_ref")"
            state_tag="automation-state/${branch#automation/}"

            if git show-ref --verify --quiet "refs/tags/$state_tag"; then
              state_commit="$(git rev-parse "refs/tags/$state_tag")"
              if [ "$state_commit" = "$automation_commit" ]; then
                continue
              fi
              echo "Le marqueur $state_tag ne correspond plus à $branch." >&2
              exit 1
            fi

            printf '%s\n' "$branch" >> "$queue_file"
          done < <(
            git for-each-ref \
              --sort=committerdate \
              --format='%(refname:short)' \
              refs/remotes/origin/automation/ \
              | grep -E '^origin/automation/(publication|review)-' || true
          )

          echo "États à avancer: $(wc -l < "$queue_file" | tr -d ' ')"
          cat "$queue_file"

          while IFS= read -r branch; do
            [ -n "$branch" ] || continue

            git fetch origin master '+refs/heads/automation/*:refs/remotes/origin/automation/*' --prune
            git fetch origin --tags --prune

            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              echo "Branche introuvable: $branch" >&2
              exit 1
            fi

            automation_commit="$(git rev-parse "origin/$branch")"
            state_tag="automation-state/${branch#automation/}"
            if git show-ref --verify --quiet "refs/tags/$state_tag"; then
              state_commit="$(git rev-parse "refs/tags/$state_tag")"
              if [ "$state_commit" = "$automation_commit" ]; then
                continue
              fi
              echo "Le marqueur $state_tag ne correspond plus à $branch." >&2
              exit 1
            fi

            base_sha="$(git rev-parse origin/master)"
            git checkout -B state-advance origin/master
            git reset --hard origin/master
            git clean -fd

            case "$branch" in
              automation/publication-*)
                node scripts/advance-publication-state.mjs
                git add -- \
                  content-data/publication-rotation.json \
                  content-data/publication-category-rotation.json \
                  content-data/publication-workflow.md
                git commit -m "chore: advance publication assignment"
                ;;
              automation/review-*)
                pending_review_files=()
                while IFS= read -r review_ref; do
                  [ -n "$review_ref" ] || continue
                  review_branch="${review_ref#origin/}"
                  review_commit="$(git rev-parse "$review_ref")"
                  processed_tag="automation-processed/${review_branch#automation/}"

                  if git show-ref --verify --quiet "refs/tags/$processed_tag"; then
                    processed_commit="$(git rev-parse "refs/tags/$processed_tag")"
                    if [ "$processed_commit" = "$review_commit" ]; then
                      continue
                    fi
                  fi

                  review_parent="$(git rev-parse "${review_commit}^")"
                  mapfile -t review_changes < <(git diff --name-only "$review_parent" "$review_commit")
                  if [ "${#review_changes[@]}" -ne 1 ] || [[ ! "${review_changes[0]}" =~ ^src/routes/articles/.+/index\.md$ ]]; then
                    echo "Branche review invalide: $review_branch" >&2
                    exit 1
                  fi
                  pending_review_files+=("${review_changes[0]}")
                done < <(
                  git for-each-ref \
                    --sort=committerdate \
                    --format='%(refname:short)' \
                    refs/remotes/origin/automation/review-
                )

                node scripts/advance-review-state.mjs "${pending_review_files[@]}"
                git add -- content-data/article-review-workflow.md
                git commit -m "chore: advance review assignment"
                ;;
            esac

            git fetch origin master
            latest_master_sha="$(git rev-parse origin/master)"
            if [ "$latest_master_sha" != "$base_sha" ]; then
              echo "master a avancé pendant le changement d'état, relance nécessaire." >&2
              exit 1
            fi

            git push origin HEAD:master
            git tag "$state_tag" "$automation_commit"
            git push origin "refs/tags/$state_tag"
          done < "$queue_file"

  publish-queue:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer Fam Space
        uses: actions/checkout@v4
        with:
          repository: DevWeb13/fam-space-qwik
          ref: master
          token: ${{ secrets.FAM_SPACE_TOKEN }}
          fetch-depth: 0
          path: fam-space

      - name: Récupérer la file d'automatisation
        working-directory: fam-space
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/automation/*:refs/remotes/origin/automation/*' --prune
          git fetch origin --tags --prune

      - name: Préparer la file à traiter
        id: queue
        working-directory: fam-space
        shell: bash
        run: |
          set -euo pipefail

          queue_file="$RUNNER_TEMP/fam-space-bridge-queue.txt"
          : > "$queue_file"

          while IFS= read -r remote_ref; do
            [ -n "$remote_ref" ] || continue
            branch="${remote_ref#origin/}"
            automation_commit="$(git rev-parse "$remote_ref")"
            processed_tag="automation-processed/${branch#automation/}"

            if git show-ref --verify --quiet "refs/tags/$processed_tag"; then
              processed_commit="$(git rev-parse "refs/tags/$processed_tag")"
              if [ "$processed_commit" = "$automation_commit" ]; then
                echo "Déjà traitée, branche conservée: $branch"
                continue
              fi
              echo "Le marqueur $processed_tag ne correspond plus à $branch." >&2
              exit 1
            fi

            printf '%s\n' "$branch" >> "$queue_file"
          done < <(
            git for-each-ref \
              --sort=committerdate \
              --format='%(refname:short)' \
              refs/remotes/origin/automation/ \
              | grep -E '^origin/automation/(publication|review|destination)-' || true
          )

          count="$(wc -l < "$queue_file" | tr -d ' ')"
          echo "Branches en attente: $count"
          cat "$queue_file"
          echo "queue_file=$queue_file" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fam-space/package-lock.json

      - name: Installer les dépendances
        working-directory: fam-space
        run: npm ci

      - name: Publier toute la file
        working-directory: fam-space
        shell: bash
        env:
          QUEUE_FILE: ${{ steps.queue.outputs.queue_file }}
        run: |
          set -euo pipefail

          failed=0

          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            echo "::group::Traitement de $branch"

            git fetch origin master '+refs/heads/automation/*:refs/remotes/origin/automation/*' --prune
            git fetch origin --tags --prune

            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              echo "Branche introuvable, elle reste hors traitement: $branch"
              failed=1
              echo "::endgroup::"
              continue
            fi

            automation_commit="$(git rev-parse "origin/$branch")"
            processed_tag="automation-processed/${branch#automation/}"

            if git show-ref --verify --quiet "refs/tags/$processed_tag"; then
              processed_commit="$(git rev-parse "refs/tags/$processed_tag")"
              if [ "$processed_commit" = "$automation_commit" ]; then
                echo "Branche déjà traitée: $branch"
                echo "::endgroup::"
                continue
              fi
              echo "Le marqueur $processed_tag ne correspond plus à $branch." >&2
              failed=1
              echo "::endgroup::"
              continue
            fi

            mapfile -t automation_commits < <(git rev-list --reverse origin/master.."origin/$branch")
            if [ "${#automation_commits[@]}" -eq 0 ]; then
              echo "Branche déjà absorbée par master, elle reste conservée: $branch"
              git tag "$processed_tag" "$automation_commit"
              if ! git push origin "refs/tags/$processed_tag"; then
                failed=1
              fi
              echo "::endgroup::"
              continue
            fi

            if [ "${#automation_commits[@]}" -ne 1 ] || [ "${automation_commits[0]}" != "$automation_commit" ]; then
              echo "La branche doit contenir exactement un commit d'automatisation au-dessus de sa base." >&2
              failed=1
              echo "::endgroup::"
              continue
            fi

            automation_parent="$(git rev-parse "${automation_commit}^")"
            mapfile -t changes < <(git diff --name-status "$automation_parent" "$automation_commit")
            if [ "${#changes[@]}" -ne 1 ]; then
              echo "Le commit d'automatisation doit contenir exactement un changement." >&2
              printf '%s\n' "${changes[@]}" >&2
              failed=1
              echo "::endgroup::"
              continue
            fi

            read -r status automation_file <<< "${changes[0]}"
            mode=""

            case "$branch" in
              automation/publication-*)
                if [ "$status" != "A" ] || [ "$automation_file" != "content-candidates/article.md" ]; then
                  echo "Candidat de publication invalide." >&2
                  failed=1
                  echo "::endgroup::"
                  continue
                fi
                mode="publication"
                ;;
              automation/review-*)
                if [ "$status" != "M" ] || [[ ! "$automation_file" =~ ^src/routes/articles/.+/index\.md$ ]]; then
                  echo "Vérification d'article invalide." >&2
                  failed=1
                  echo "::endgroup::"
                  continue
                fi
                mode="review"
                ;;
              automation/destination-*)
                if [ "$status" != "A" ] || [ "$automation_file" != "content-candidates/destination.md" ]; then
                  echo "Candidat Destination invalide." >&2
                  failed=1
                  echo "::endgroup::"
                  continue
                fi
                actual_message="$(git show -s --format=%s "$automation_commit")"
                if [ "$actual_message" != "content: destination candidate" ]; then
                  echo "Message de commit Destination invalide: $actual_message" >&2
                  failed=1
                  echo "::endgroup::"
                  continue
                fi
                mode="destination"
                ;;
            esac

            git checkout -B bridge-runner origin/master
            git reset --hard origin/master
            git clean -fd

            success=false
            case "$mode" in
              publication)
                if bash scripts/publish-queued-publication.sh "$automation_commit" "$automation_file"; then
                  success=true
                fi
                ;;
              review)
                if bash scripts/publish-queued-review.sh "$automation_commit" "$automation_file"; then
                  success=true
                fi
                ;;
              destination)
                if bash .github/scripts/publish-destination-candidate.sh "$automation_commit" "$automation_file"; then
                  success=true
                fi
                ;;
            esac

            if [ "$success" = true ]; then
              git fetch origin --tags --prune
              if ! git show-ref --verify --quiet "refs/tags/$processed_tag"; then
                git tag "$processed_tag" "$automation_commit"
                if ! git push origin "refs/tags/$processed_tag"; then
                  echo "Travail publié mais impossible de créer le marqueur: $branch" >&2
                  failed=1
                fi
              fi
              echo "Travail publié, branche conservée: $branch"
            else
              echo "Échec du traitement de $branch. La branche reste intacte pour un prochain cron." >&2
              failed=1
            fi

            echo "::endgroup::"
          done < "$QUEUE_FILE"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
