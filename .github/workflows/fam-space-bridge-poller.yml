name: Fam Space bridge poller

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: fam-space-bridge-poller
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest

    steps:
      - name: Détecter et transmettre les nouvelles branches éditoriales
        shell: bash
        env:
          FAM_SPACE_TOKEN: ${{ secrets.FAM_SPACE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          response="$(
            curl --fail-with-body --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $FAM_SPACE_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/DevWeb13/fam-space-qwik/git/matching-refs/heads/automation/"
          )"

          mapfile -t branches < <(
            printf '%s' "$response" \
              | jq -r '.[].ref' \
              | sed 's#^refs/heads/##' \
              | grep -E '^automation/(publication-ready|review-ready)-' \
              || true
          )

          echo "Nouvelles branches éditoriales en attente: ${#branches[@]}"
          if [ "${#branches[@]}" -eq 0 ]; then
            exit 0
          fi

          for branch in "${branches[@]}"; do
            echo "Transmission au bridge: $branch"
            payload="$(jq -nc --arg branch "$branch" '{ref:"main",inputs:{automation_branch:$branch}}')"

            curl --fail-with-body --silent --show-error --location \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/fam-space-bridge.yml/dispatches" \
              --data "$payload"
          done
