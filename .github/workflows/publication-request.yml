name: Publication request

on:
  push:
    branches:
      - main
    paths:
      - publication-request.md

permissions:
  contents: write

concurrency:
  group: fam-space-master-write
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer la requête
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: bridge

      - name: Ignorer le marqueur prêt
        id: ready
        working-directory: bridge
        shell: bash
        run: |
          if [ "$(tr -d '\r\n' < publication-request.md)" = "# Ready" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Récupérer Fam Space
        if: steps.ready.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: DevWeb13/fam-space-qwik
          ref: master
          token: ${{ secrets.FAM_SPACE_TOKEN }}
          fetch-depth: 0
          path: fam-space

      - name: Préparer Node
        if: steps.ready.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fam-space/package-lock.json

      - name: Installer les dépendances
        if: steps.ready.outputs.skip != 'true'
        working-directory: fam-space
        run: npm ci --no-audit --no-fund

      - name: Traiter la requête Publication
        if: steps.ready.outputs.skip != 'true'
        id: process
        working-directory: fam-space
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum ../bridge/bridge-request.txt | cut -d' ' -f1)"
          bash .github/scripts/process-publication-request.sh             ../bridge/publication-request.md             ../bridge/publication-state.json             ../bridge/publication-runtime.md             ../bridge/bridge-request.txt
          after="$(sha256sum ../bridge/bridge-request.txt | cut -d' ' -f1)"
          if [ "$before" = "$after" ]; then
            echo "bridge_request_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "bridge_request_changed=true" >> "$GITHUB_OUTPUT"
          fi
          cp ../bridge/publication-state.json "$RUNNER_TEMP/publication-state.json"
          cp ../bridge/publication-runtime.md "$RUNNER_TEMP/publication-runtime.md"
          if [ "$before" != "$after" ]; then
            cp ../bridge/bridge-request.txt "$RUNNER_TEMP/bridge-request.txt"
          fi

      - name: Enregistrer l'état et remettre l'entrée à zéro
        if: always() && steps.ready.outputs.skip != 'true'
        working-directory: bridge
        shell: bash
        env:
          BRIDGE_REQUEST_CHANGED: ${{ steps.process.outputs.bridge_request_changed }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B publication-request-state origin/main
            if [ -f "$RUNNER_TEMP/publication-state.json" ]; then
              cp "$RUNNER_TEMP/publication-state.json" publication-state.json
            fi
            if [ -f "$RUNNER_TEMP/publication-runtime.md" ]; then
              cp "$RUNNER_TEMP/publication-runtime.md" publication-runtime.md
            fi
            if [ "$BRIDGE_REQUEST_CHANGED" = "true" ] && [ -f "$RUNNER_TEMP/bridge-request.txt" ]; then
              cp "$RUNNER_TEMP/bridge-request.txt" bridge-request.txt
            fi
            printf '# Ready\n' > publication-request.md

            git add publication-request.md
            if [ -f "$RUNNER_TEMP/publication-state.json" ]; then
              git add publication-state.json
            fi
            if [ -f "$RUNNER_TEMP/publication-runtime.md" ]; then
              git add publication-runtime.md
            fi
            if [ "$BRIDGE_REQUEST_CHANGED" = "true" ] && [ -f "$RUNNER_TEMP/bridge-request.txt" ]; then
              git add bridge-request.txt
            fi
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "state: advance Publication runtime"
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "Impossible d'enregistrer l'état Publication après 3 tentatives." >&2
          exit 1
