name: Cleanup old publication branches

on:
  push:
    branches:
      - main
    paths:
      - cleanup-old-publication-branches.request

permissions:
  contents: read

concurrency:
  group: fam-space-master-write
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fam Space
        uses: actions/checkout@v4
        with:
          repository: DevWeb13/fam-space-qwik
          ref: master
          token: ${{ secrets.FAM_SPACE_TOKEN }}
          fetch-depth: 0

      - name: Delete inactive publication branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "automation/publication-20260918-1900-villandry-famille"
            "automation/publication-20260919-1256-peaugres-famille"
            "automation/publication-20260927-2020-blois-famille"
            "automation/publication-20260929-0813-halloween-syndicat"
            "automation/publication-20260929-0813-marche-noel-bruyeres"
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done
