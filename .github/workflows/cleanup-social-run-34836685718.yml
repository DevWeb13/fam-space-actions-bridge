name: Cleanup bad social posts 34836685718

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Delete only the bad Facebook and Threads posts
        shell: bash
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          set -uo pipefail

          set +e
          node scripts/cleanup-social-run-34836685718.mjs social-state.json
          cleanup_status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-state.json
          if ! git diff --cached --quiet; then
            git commit -m "social: record cleanup of bad text posts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

          exit "$cleanup_status"
