name: Temporary delete stale image branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-delete-image-branch.yml

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fam Space
        uses: actions/checkout@v4
        with:
          repository: DevWeb13/fam-space-qwik
          token: ${{ secrets.FAM_SPACE_TOKEN }}
          fetch-depth: 0

      - name: Delete stale image branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete automation/image-20260920-0445
