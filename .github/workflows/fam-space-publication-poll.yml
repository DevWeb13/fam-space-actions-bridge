name: Fam Space publication poll

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fam-space-publication-poll.yml
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: fam-space-publication-poll
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer l'état du bridge
        uses: actions/checkout@v4

      - name: Détecter une phase Publication en attente
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FAM_SPACE_TOKEN }}
        run: |
          set -euo pipefail

          if [ ! -f publication-state.json ]; then
            echo "publication-state.json absent; rien à traiter."
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          phase="$(node -e 'const s=require("./publication-state.json");process.stdout.write(String(s.phase ?? ""))')"
          active_branch="$(node -e 'const s=require("./publication-state.json");process.stdout.write(s.activeBranch || "")')"
          last_processed="$(node -e 'const s=require("./publication-state.json");process.stdout.write(s.lastProcessedCommit || "")')"

          branch=""

          if [ "$phase" = "1" ]; then
            newest_date=""
            while IFS=$'\t' read -r candidate candidate_sha; do
              [ -n "$candidate" ] || continue
              commit_date="$(gh api "repos/DevWeb13/fam-space-qwik/commits/$candidate_sha" --jq '.commit.committer.date')"
              if [ -z "$newest_date" ] || [[ "$commit_date" > "$newest_date" ]]; then
                newest_date="$commit_date"
                branch="$candidate"
              fi
            done < <(
              gh api --paginate "repos/DevWeb13/fam-space-qwik/branches?per_page=100"                 --jq '.[] | select(.name | startswith("automation/publication-")) | [.name, .commit.sha] | @tsv'
            )

            if [ -z "$branch" ]; then
              echo "Aucune branche Publication en attente."
              echo "branch=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            if [ -z "$active_branch" ]; then
              echo "Phase $phase sans activeBranch; aucune action automatique." >&2
              echo "branch=" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            encoded_branch="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$active_branch")"
            current_sha="$(gh api "repos/DevWeb13/fam-space-qwik/branches/$encoded_branch" --jq '.commit.sha')"

            if [ -n "$last_processed" ] && [ "$current_sha" = "$last_processed" ]; then
              echo "Aucun nouveau commit sur $active_branch."
              echo "branch=" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            branch="$active_branch"
          fi

          echo "Phase $phase en attente détectée sur $branch."
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Déclencher le bridge existant
        if: steps.detect.outputs.branch != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_BRANCH: ${{ steps.detect.outputs.branch }}
        run: |
          set -euo pipefail
          gh workflow run fam-space-bridge.yml             --repo DevWeb13/fam-space-actions-bridge             -f automation_branch="$AUTOMATION_BRANCH"
          echo "Bridge déclenché pour $AUTOMATION_BRANCH."
