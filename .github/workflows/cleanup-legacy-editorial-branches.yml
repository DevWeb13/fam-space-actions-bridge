name: Cleanup legacy editorial branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-legacy-editorial-branches.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Supprimer les dernières branches review historiques auditées
        shell: bash
        env:
          FAM_SPACE_TOKEN: ${{ secrets.FAM_SPACE_TOKEN }}
        run: |
          set -euo pipefail

          branches=(

          )

          for branch in "${branches[@]}"; do
            encoded="$(jq -rn --arg value "$branch" '$value|@uri')"

            for attempt in 1 2 3; do
              body_file="$(mktemp)"
              status="$(
                curl --silent --show-error \
                  --output "$body_file" \
                  --write-out "%{http_code}" \
                  --request DELETE \
                  --header "Accept: application/vnd.github+json" \
                  --header "Authorization: Bearer $FAM_SPACE_TOKEN" \
                  --header "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/DevWeb13/fam-space-qwik/git/refs/heads/$encoded"
              )"

              if [ "$status" = "204" ]; then
                echo "Supprimée: $branch"
                rm -f "$body_file"
                break
              fi

              if [ "$status" = "404" ]; then
                echo "Déjà absente: $branch"
                rm -f "$body_file"
                break
              fi

              if { [ "$status" = "403" ] || [ "$status" = "429" ] || [[ "$status" =~ ^5 ]]; } && [ "$attempt" -lt 3 ]; then
                echo "Réponse temporaire $status pour $branch, nouvelle tentative."
                rm -f "$body_file"
                sleep 5
                continue
              fi

              echo "Échec de suppression ($status): $branch" >&2
              cat "$body_file" >&2
              rm -f "$body_file"
              exit 1
            done

            sleep 1
          done
